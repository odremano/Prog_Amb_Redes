<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Maquetación básica: header, nav, main y footer</title>
<style>

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  header, footer {
    width: 100%;
    height: 15%;
    background-color: #808080;
    color: white;
    display: flex;
    align-items: center;
    padding: 0 20px;
  }

  footer {
    justify-content: center;
  }

  .cuerpo {
    width: 100%;
    height: 70%;
  }

  nav {
    float: left;
    width: 20%;
    height: 100%;
    background-color: #f4776a;
    padding: 16px;
    box-sizing: border-box;
  }

  nav h2 {
    text-align: center;
    margin-bottom: 10px;
  }

  nav ul {
    list-style: none;
    background-color: #bebebe;
    padding: 10px;
  }

  nav li {
    padding: 6px 0;
  }

  nav a {
    color: black;
    text-decoration: none;
  }

  main {
    float: left;
    width: 80%;
    height: 100%;
    background-color: #1abc9c;
    color: white;
    padding: 16px;
    box-sizing: border-box;
    overflow: auto;
  }

  .divConPadding {
    background: linear-gradient(to right, deeppink, orange);
    padding: 16px;
    margin-top: 16px;
    text-align: left;
  }

  .divSinPadding {
    background: linear-gradient(to right, deeppink, orange);
    margin-top: 16px;
    text-align: left;
  }

  .corteFlotacion {
    clear: both; /* corta la flotación de nav y main */
  }

  main img {
    max-width: 300px;
    display: block;
    margin-top: 16px;
  }

</style>
</head>
<body>

  <header>
    <h1>Título principal de página 1</h1>
  </header>

  <div class="cuerpo">
    <nav>
      <h2>Menu</h2>
      <ul>
        <li><a href="../../../Html/index.html">HTML</a></li>
        <li><a href="../../index.html">CSS</a></li>
      </ul>
    </nav>

    <main>
      <p>Contenido inicial</p>
      <img src="./monte-fuji-sakura.jpg" alt="Monte Fuji con cerezos">
      <div class="divConPadding">Nodo de texto en div4, alineado a la izquierda y con padding.</div>
      <div class="divSinPadding">Nodo de texto en div5, alineado a la izquierda y sin padding.</div>
    </main>

    <div class="corteFlotacion"></div>
  </div>

  <footer>
    <p>Pie de página</p>
  </footer>

  <p style="text-align:center;padding:12px;"><a href="../../index.html">Volver al índice de Css</a></p>

</body>
</html>
