<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>JS05 - Función con nombre</title>
</head>
<body style="font-family:Arial, sans-serif; margin:40px;">

  <h1>Ejercicio 5: función con nombre</h1>

  <script>
    function menor(n1, n2) {
      if (n1 <= n2) {
        return n1;
      }
      else {
        return n2;
      }
    }

    let num1 = parseInt(prompt("Ingrese el primer número"));
    let num2 = parseInt(prompt("Ingrese el segundo número"));

    document.write("<h3>El menor entre " + num1 + " y " + num2 + " es: " + menor(num1, num2) + "</h3>");
  </script>

  <p><a href="../../index.html">Volver al índice de Js</a></p>

</body>
</html>
