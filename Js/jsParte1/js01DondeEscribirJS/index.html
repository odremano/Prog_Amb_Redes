<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>JS01 - Dónde escribir JavaScript</title>
</head>
<body style="font-family:Arial, sans-serif; margin:40px;">

  <h1>Ejercicio 1: dónde se escribe JavaScript</h1>

  <p>Este párrafo fue escrito directamente en HTML.</p>

  <script>
    /* El código de java script se escribe dentro de un marco de etiquetas <script> */

    document.write("<p>Este párrafo fue escrito desde JavaScript usando document.write().</p>");

    alert("Este mensaje se muestra con alert() al cargar la página.");
  </script>

  <p><a href="../../index.html">Volver al índice de Js</a></p>

</body>
</html>
