<!DOCTYPE html>

<title>JS06 - Función flecha</title>
</head>
<body style="font-family:Arial, sans-serif; margin:40px;">

  <h1>Ejercicio 6: función flecha (arrow function)</h1>

  <script>
    const cuadrado = (n) => {
      return n * n;
    };

    let valor = parseInt(prompt("Ingrese un número"));

    document.write("<h3>El cuadrado de " + valor + " es: " + cuadrado(valor) + "</h3>");
  </script>

  <p><a href="../../index.html">Volver al índice de Js</a></p>

</body>
</html>
