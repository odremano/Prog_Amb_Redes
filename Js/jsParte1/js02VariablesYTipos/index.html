<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>JS02 - Variables y tipado dinámico</title>
</head>
<body style="font-family:Arial, sans-serif; margin:40px;">

  <h1>Ejercicio 2: variables (var, let, const) y tipado dinámico</h1>

  <script>
    /* Se usa var acá a propósito, para comparar con let y const */
    var vGlobal = "declarada con var";
    let a = 10;
    const PI = 3.14;

    document.write("<p>vGlobal: " + vGlobal + ", tipo: " + typeof vGlobal + "</p>");
    document.write("<p>a: " + a + ", tipo: " + typeof a + "</p>");
    document.write("<p>PI: " + PI + ", tipo: " + typeof PI + "</p>");

    /* Java script es de tipado dinámico: la misma variable puede cambiar de tipo */
    a = "ahora a es un texto";
    document.write("<p>a reasignada: " + a + ", tipo: " + typeof a + "</p>");
  </script>

  <p><a href="../../index.html">Volver al índice de Js</a></p>

</body>
</html>
