<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>JS03 - Operadores</title>
</head>
<body style="font-family:Arial, sans-serif; margin:40px;">

  <h1>Ejercicio 3: operadores aritméticos, de comparación y lógicos</h1>

  <script>
    let x = 8;
    let y = 3;

    document.write("<p>x + y = " + (x + y) + "</p>");
    document.write("<p>x - y = " + (x - y) + "</p>");
    document.write("<p>x * y = " + (x * y) + "</p>");
    document.write("<p>x / y = " + (x / y) + "</p>");
    document.write("<p>x % y (resto) = " + (x % y) + "</p>");

    document.write("<p>x > y : " + (x > y) + "</p>");
    document.write("<p>x == y : " + (x == y) + "</p>");
    document.write("<p>(x > y) && (y > 0) : " + ((x > y) && (y > 0)) + "</p>");
    document.write("<p>(x < y) || (y > 0) : " + ((x < y) || (y > 0)) + "</p>");

    document.write("<p>Concatenación: " + "x vale " + x + "</p>");
  </script>

  <p><a href="../../index.html">Volver al índice de Js</a></p>

</body>
</html>
