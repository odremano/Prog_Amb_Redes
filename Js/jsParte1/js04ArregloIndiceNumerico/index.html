<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>JS04 - Arreglo de índice numérico</title>
</head>
<body style="font-family:Arial, sans-serif; margin:40px;">

  <h1>Ejercicio 4: arreglo de índice numérico</h1>

  <script>
    var arregloColores = [];
    arregloColores = ["rojo", "azul"];
    arregloColores.push(prompt("Ingrese un tercer color"));

    document.write("<h4>Primer color cargado desde programa: " + arregloColores[0] + "</h4>");
    document.write("<h4>Segundo color cargado desde programa: " + arregloColores[1] + "</h4>");
    document.write("<h4>Tercer color cargado desde teclado: " + arregloColores[2] + "</h4>");
    document.write("<h4>Cantidad de colores: " + arregloColores.length + "</h4>");
  </script>

  <p><a href="../../index.html">Volver al índice de Js</a></p>

</body>
</html>
