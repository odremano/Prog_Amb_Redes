<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>JS08 - Redirección y cambio de clase</title>
<style>
  .destacado { color: blue; font-weight: bold; }
</style>
</head>
<body style="font-family:Arial, sans-serif; margin:40px;">

  <h1>Ejercicio 8: objeto location y cambio de clase por JavaScript</h1>

  <p id="texto">Este texto puede cambiar de estilo con un click.</p>

  <button id="btnClase">Cambiar estilo</button>
  <button id="btnIr">Ir al índice principal de la materia</button>

  <script>
    document.getElementById("btnClase").addEventListener("click", function() {
      document.getElementById("texto").className = "destacado";
    });

    document.getElementById("btnIr").addEventListener("click", function() {
      location.href = "../../../index.html";
    });
  </script>

  <p><a href="../../index.html">Volver al índice de Js</a></p>

</body>
</html>
