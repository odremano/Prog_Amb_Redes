<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>JS02 - Debugger</title>
</head>
<body style="font-family:Arial, sans-serif; margin:40px;">

  <h1>Ejercicio 2: debugger</h1>

  <p>
    Este ejercicio no escribe nada en la página: los valores se envían a la consola del navegador.
    Para verlos, abrí las herramientas de desarrollo con la tecla F12 y elegí la pestaña Consola.
  </p>

  <script>
    /* Declaración de las variables: todavía no tienen valor (undefined) */
    let a;
    let b;
    let c;

    /* Asignación de valores */
    a = 7;
    b = 3;
    c = a + b;

    /* Envío de los valores a la consola de depuración */
    console.log("Valor de la variable a: " + a);
    console.log("Valor de la variable b: " + b);
    console.log("Valor de la variable c: " + c);
  </script>

  <p><a href="../../index.html">Volver al índice de Js</a></p>

</body>
</html>
