<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>JS10 - Formulario de alta de tareas</title>
</head>
<body style="font-family:Arial, sans-serif; margin:40px;">

  <h1>Ejercicio 10: alta de tareas con validación HTML5</h1>

  <form id="formTarea">
    <label>Tarea: <input type="text" id="descripcion" required></label>
    <label>Prioridad (1 a 5): <input type="number" id="prioridad" min="1" max="5" required></label>
    <button type="button" id="btnAlta">Agregar tarea</button>
    <button type="button" id="btnVaciar">Vaciar lista</button>
  </form>

  <div id="listado"></div>

  <script>
    var arregloTareas = [];

    document.getElementById("btnAlta").addEventListener("click", function() {
      if (document.getElementById("formTarea").checkValidity()) {
        var nuevaTarea = {
          descripcion: document.getElementById("descripcion").value,
          prioridad: document.getElementById("prioridad").value
        };
        arregloTareas.push(nuevaTarea);
        mostrarTareas();
        document.getElementById("formTarea").reset();
      }
      else {
        alert("Complete los datos correctamente antes de agregar la tarea.");
      }
    });

    document.getElementById("btnVaciar").addEventListener("click", function() {
      var confirma = confirm("¿Está seguro de vaciar la lista de tareas?");
      if (confirma) {
        arregloTareas = [];
        mostrarTareas();
      }
    });

    function mostrarTareas() {
      var texto = "<h3>Tareas cargadas: " + arregloTareas.length + "</h3>";
      arregloTareas.forEach(function(item, indice) {
        texto = texto + "<p>" + (indice + 1) + ") " + item.descripcion + " - prioridad " + item.prioridad + "</p>";
      });
      document.getElementById("listado").innerHTML = texto;
    }
  </script>

  <p><a href="../../index.html">Volver al índice de Js</a></p>

</body>
</html>
