<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>JS11 - Creación y eliminación dinámica de elementos</title>
<style>
  .cajaCreada { border: 1px solid #999; padding: 5px; margin: 5px 0; }
</style>
</head>
<body style="font-family:Arial, sans-serif; margin:40px;">

  <h1>Ejercicio 11: creación y eliminación dinámica de elementos del DOM</h1>

  <button id="btnCrear">Crear elemento</button>
  <button id="btnEliminar">Eliminar todos</button>

  <div id="contenedor"></div>

  <script>
    let contador = 0;

    document.getElementById("btnCrear").addEventListener("click", function() {
      contador++;
      const objDiv = document.createElement("div");
      objDiv.innerHTML = "Elemento número: " + contador;
      objDiv.className = "cajaCreada";
      document.getElementById("contenedor").appendChild(objDiv);
    });

    document.getElementById("btnEliminar").addEventListener("click", function() {
      while (document.getElementById("contenedor").childNodes.length > 0) {
        document.getElementById("contenedor").removeChild(document.getElementById("contenedor").childNodes[0]);
      }
      contador = 0;
    });
  </script>

  <p><a href="../../index.html">Volver al índice de Js</a></p>

</body>
</html>
